[phases.setup]
nixPkgs = [
  "chromium",
  "chromium-driver",
  "glib",
  "glibc",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "libxcb",
  "libxkbcommon",
  "mesa",
  "pango",
  "cairo",
  "alsa-lib",
  "xvfb-run",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium",
  "playwright install-deps chromium",
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
